<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-label="Cars reaching age ten in Singapore: about 79,000 a year from October 2026 to September 2029, then about 48,000 a year. Category A and B COE supply when the largest group feeds through: about 5,700, 4,700 or 3,800 a month if 30, 45 or 60 per cent of owners renew.">
  <!-- Share card (E1) for the COE buy-now-or-wait piece. Same figures as the article;
       bars to scale (90,000 cars = 420 units). Provenance printed on the image. -->
  <rect width="1080" height="1350" fill="#081627"/>
  <text x="80" y="120" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#C89A3C">SINGAPORE COE SUPPLY</text>
  <text x="80" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#F6F4EF">Buy a car now or wait?</text>
  <text x="80" y="262" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#F6F4EF" opacity="0.85">Cars reaching age ten, each year from October</text>

  <!-- baseline y=760 -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="110" y="403.6" width="140" height="356.4" rx="5" fill="#C89A3C"/>
    <rect x="290" y="368.1" width="140" height="391.9" rx="5" fill="#C89A3C"/>
    <rect x="470" y="400.2" width="140" height="359.8" rx="5" fill="#C89A3C"/>
    <rect x="650" y="546.8" width="140" height="213.2" rx="5" fill="#C89A3C" opacity="0.45"/>
    <rect x="830" y="528.3" width="140" height="231.7" rx="5" fill="#C89A3C" opacity="0.45"/>
    <line x1="90" y1="760" x2="990" y2="760" stroke="#F6F4EF" stroke-width="2" opacity="0.5"/>
    <g font-size="26" fill="#F6F4EF" text-anchor="middle" font-weight="700">
      <text x="180" y="390">76,366</text><text x="360" y="354">83,984</text><text x="540" y="386">77,097</text>
      <text x="720" y="532">45,683</text><text x="900" y="514">49,640</text>
    </g>
    <g font-size="24" fill="#F6F4EF" opacity="0.75" text-anchor="middle">
      <text x="180" y="798">2026–27</text><text x="360" y="798">2027–28</text><text x="540" y="798">2028–29</text>
      <text x="720" y="798">2029–30</text><text x="900" y="798">2030–31</text>
    </g>
  </g>

  <text x="80" y="890" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#F6F4EF">About 40% fewer after September 2029.</text>
  <text x="80" y="960" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#F6F4EF" opacity="0.9">Category A+B COEs a month when the largest group</text>
  <text x="80" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#F6F4EF" opacity="0.9">feeds through (Nov 2028–Jan 2029), by share renewing:</text>
  <text x="80" y="1070" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#C89A3C">30%: 5,700 · 45%: 4,700 · 60%: 3,800</text>
  <text x="80" y="1118" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#F6F4EF" opacity="0.85">Announced now: 4,280 a month. Scenarios, not a forecast.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#F6F4EF" opacity="0.65">
    <text x="80" y="1210">LTA vehicle-age table at 30 Sep 2026, all categories. Quota Nov 2026–Jan 2027.</text>
    <text x="80" y="1242">Scenarios: our computation from LTA age and deregistration tables.</text>
  </g>
  <text x="80" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#C89A3C">theenoughpoint.com/singapore-coe-prices-buy-now-or-wait</text>
</svg>
